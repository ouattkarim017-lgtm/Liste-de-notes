<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes post-it</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="javaScript.js" defer type="module"></script>
</head>

<body>

  <header>
    <h1>Mes post-it</h1>
    <p>Cliquez sur une note pour modifier son texte.</p>
  </header>

  <main class="board">
    <div class="notes" contenteditable="true">
      <input type="text" id="inputTitre" placeholder="Titre...."></input>
      <input type="text" id="inputcontenu" placeholder="contenu...."></input>
      <button type="button" class="ajouter">+</button>
    </div>
  </main>

</body>

</html>
